name: Validate design-system contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository contracts
        run: node scripts/validate-documentation.mjs
      - name: Run validator tests
        run: node --test scripts/validate-documentation.test.mjs
